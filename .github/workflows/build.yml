# Builds the mod jar on every push. Download it from the run's "Artifacts" section.
# Pushing a tag like v0.1.0 also publishes a GitHub Release with the jar attached.
name: Build

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: |
            8
            17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Probe plugin repository
        run: |
          M=https://nexus.gtnewhorizons.com/repository/public/com/gtnewhorizons/retrofuturagradle/com.gtnewhorizons.retrofuturagradle.gradle.plugin/maven-metadata.xml
          code=$(curl -s -o meta.xml -w '%{http_code}' "$M")
          echo "::notice title=RFG metadata HTTP $code::$(grep -o '<version>[^<]*' meta.xml | sed 's/<version>//' | tr '\n' ' ')"

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          # Surface the important lines as annotations so they show on the run summary page.
          grep -E "error:|\* What went wrong|Could not|Exception|FAILED" build.log | grep -v "^\s*at " | head -15 | while IFS= read -r line; do
            echo "::error title=Gradle::${line}"
          done
          awk '/\* What went wrong:/{f=1} /\* Try:/{f=0} f' build.log | head -40 > wrong.txt || true
          if [ -s wrong.txt ]; then
            echo "::error title=What went wrong::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' wrong.txt)"
          fi

      - name: Pick the release jar
        run: |
          mkdir -p dist
          find build/libs -name '*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' ! -name '*-api.jar' -exec cp {} dist/ \;
          ls -la dist

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: fpanim-jar
          path: dist/*.jar
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar

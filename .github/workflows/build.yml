# Builds the mod jar on every push. Download it from the run's "Artifacts" section.
# Pushing a tag like v0.1.0 also publishes a GitHub Release with the jar attached.
name: Build

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            8
            17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Pick the release jar
        run: |
          mkdir -p dist
          find build/libs -name '*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' ! -name '*-api.jar' -exec cp {} dist/ \;
          ls -la dist

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: fpanim-jar
          path: dist/*.jar
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
